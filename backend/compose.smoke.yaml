# Disposable startup/static-file checks only. Never loads backend/.env.
services:
  mongo:
    image: mongo:8.0
    tmpfs:
      - /data/db
      - /data/configdb
    networks: [isolated]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    networks: [isolated]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      target: runtime
    image: bidwars-backend:smoke
    environment:
      NODE_ENV: production
      PORT: "8080"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      MONGODB_URI: mongodb://mongo:27017/bidwars_smoke
      REDIS_URL: redis://redis:6379
      ACCESS_TOKEN_SECRET: smoke-only-not-a-production-secret
      GROK_KEY: smoke-only-disabled
      LEMON_FOX_KEY: smoke-only-disabled
      AUDIO_STORAGE: local
      AUDIO_DIRECTORY: /app/audioFiles
    tmpfs:
      - /app/audioFiles:uid=10001,gid=10001,mode=0750
    networks: [isolated]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const s=require('node:net').connect(Number(process.env.PORT),'127.0.0.1');
          s.setTimeout(2000,()=>{s.destroy();process.exitCode=1});
          s.on('connect',()=>s.end());s.on('error',()=>{process.exitCode=1});
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12
  # Internal-only containers cannot publish host ports. Forward through a separate
  # container so the application itself retains no outbound internet route.
  gateway:
    image: nginx:1.28-alpine
    volumes:
      - ./scripts/smoke-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [isolated, ingress]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:8080/BidWarsSVGs/watch.svg"]
      interval: 3s
      timeout: 3s
      retries: 10
networks:
  isolated:
    internal: true
  ingress: {}
